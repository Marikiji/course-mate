{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <h1 class="h3 mb-3">{{ '编辑课程' if course else '添加课程' }}</h1>

    <form method="post" class="card card-body shadow-sm">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="name">课程名</label>
          <input class="form-control" id="name" name="name"
                 value="{{ form.name }}" required>
        </div>

        <div class="col-md-3">
          <label class="form-label" for="credits">学分</label>
          <input class="form-control" id="credits" name="credits" type="number"
                 step="0.5" min="0.5" value="{{ form.credits }}" required>
        </div>

        <div class="col-md-3">
          <label class="form-label" for="category">类型</label>
          <select class="form-select" id="category" name="category">
            {% for category in categories %}
              <option value="{{ category }}"
                {% if form.category == category %}selected{% endif %}>
                {{ category }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label" for="day">星期</label>
          <select class="form-select" id="day" name="day">
            {% for day in days %}
              <option value="{{ day }}" {% if form.day == day %}selected{% endif %}>
                {{ day }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label" for="start">开始时间</label>
          <input class="form-control" id="start" name="start" type="time"
                 value="{{ form.start }}" required>
        </div>

        <div class="col-md-4">
          <label class="form-label" for="end">结束时间</label>
          <input class="form-control" id="end" name="end" type="time"
                 value="{{ form.end }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label" for="location">地点（可选）</label>
          <input class="form-control" id="location" name="location"
                 value="{{ form.location }}" placeholder="如：教学楼 A-301">
        </div>

        <div class="col-md-6">
          <label class="form-label" for="score">成绩（可选）</label>
          <input class="form-control" id="score" name="score"
                 value="{{ form.score }}" placeholder="85 或 A-，没出分就留空">
        </div>
      </div>

      <div class="mt-4">
        <button class="btn btn-primary">保存</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">取消</a>
      </div>
    </form>

    <p class="text-muted small mt-3">
      时间用 24 小时制，例如 08:00–09:40。成绩支持百分制和五级制（A/A-/B+…）。
    </p>
  </div>
</div>
{% endblock %}
